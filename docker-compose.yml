x-backend-env: &backend-env
  API_KEY: ${API_KEY:-change-me}
  DATABASE_URL: postgresql+psycopg://invoice:invoice@db:5432/invoice
  REDIS_URL: redis://redis:6379/0
  STORAGE_DIR: /data/storage
  DATA_DIR: /data/repo
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-gemma-4-31b-it}
  LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gemma-4-26b-a4b-it}
  LLM_FAKE: ${LLM_FAKE:-true}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
  MAX_PAGES: ${MAX_PAGES:-1500}
  OCR_DPI: ${OCR_DPI:-300}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: invoice
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/data/storage
      - ./data:/data/repo:ro
      - ./docs/eval:/data/eval
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health').status == 200"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    environment: *backend-env
    volumes:
      - storage_data:/data/storage
      - ./data:/data/repo:ro
    command: python -m app.worker
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      API_KEY: ${API_KEY:-change-me}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    profiles: ["ui", "full"]

volumes:
  postgres_data:
  storage_data:
